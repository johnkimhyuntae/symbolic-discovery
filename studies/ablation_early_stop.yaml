# Ablation study - BACON.3F without early stopping
# Command: symbolic-discovery run --study studies/ablation_early_stop.yaml --log-level verbose --output ablation_early_stop.csv
variants:
  - {name: baseline, model: bacon3f}
  - {name: no_early_stop, model: bacon3f, params: {r2_threshold: 2.0}}
datasets: [T, F11, F15, F34, F41, F58, F60, F64, F83, F85, F96] # T + Representative 10 Fs
noise: [0.0, 0.025] # Clean and medium noise.
seeds: [73,74,75,76,77,78,79,80,81,82]