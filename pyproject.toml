[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-discovery"
version = "0.1.0"
requires-python = ">=3.10"

description = "A benchmarking framework for symbolic regression research, implementing BACON.3F/BACON.7F alongside PySR with curated datasets and a unified experiment runner."
readme = "README.md"

dependencies = [
	"numpy>=1.23",
	"pandas>=1.5",
	"PyYAML>=6.0",
	"scipy>=1.9",
	"sympy>=1.10",
	"rich>=13.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8",
]
pysr = [
	"pysr>=0.16",
]

[project.scripts]
symbolic-discovery = "symbolic_discovery.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["symbolic_discovery*"]

[tool.setuptools.package-data]
"symbolic_discovery.data" = ["feynman_exclusions.json"]