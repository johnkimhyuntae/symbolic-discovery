[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-discovery"
version = "0.1.1"
requires-python = ">=3.10"
description = "A benchmarking framework for symbolic regression research, implementing BACON.3F/BACON.7F alongside PySR with configurable, curated datasets and a unified experiment runner."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Hyuntae Kim" }]
keywords = ["symbolic-regression", "bacon", "pysr", "benchmarking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

dependencies = [
	"numpy>=1.23",
	"pandas>=1.5",
	"PyYAML>=6.0",
	"scipy>=1.9",
	"sympy>=1.10",
	"rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "pandas-stubs",
    "scipy-stubs",
    "types-PyYAML",
]
pysr = [
	"pysr>=0.16",
]

[project.scripts]
symbolic-discovery = "symbolic_discovery.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["symbolic_discovery*"]

[tool.setuptools.package-data]
"symbolic_discovery.data" = ["feynman_exclusions.json"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*", "pysr", "pysr.*"]
ignore_missing_imports = true